[package]
name = "agent-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Containerized code sandbox service"
license = "MIT"
publish = false

[dependencies]
prost = "0.13"
tokio = { version = "1.44", features = [
  "fs",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tonic = "0.12"
tonic-health = "0.12"
tonic-reflection = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
