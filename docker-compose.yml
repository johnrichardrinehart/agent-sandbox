services:
  agent:
    build:
      context: .
    image: ghcr.io/johnrichardrinehart/agent-sandbox:latest
    environment:
      AGENT_SANDBOX_LISTEN: 0.0.0.0:8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
