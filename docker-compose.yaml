services:
  agent:
    build:
      context: .
    image: ghcr.io/johnrichardrinehart/agent-sandbox:latest
    environment:
      AGENT_SANDBOX_LISTEN: 0.0.0.0:8080
      AGENT_SANDBOX_BACKUP_HOST: ${AGENT_SANDBOX_BACKUP_HOST:-agent-sandbox}
      AGENT_SANDBOX_BACKUP_INTERVAL_SECONDS: ${AGENT_SANDBOX_BACKUP_INTERVAL_SECONDS:-300}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP:-false}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_PASSWORD_COMMAND: ${RESTIC_PASSWORD_COMMAND:-}
      RESTIC_PASSWORD_FILE: ${RESTIC_PASSWORD_FILE:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-s3:http://host.docker.internal:9000/agent-sandbox/home}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    cap_drop:
      - ALL
    restart: unless-stopped
    security_opt:
      - seccomp=${AGENT_SANDBOX_SECCOMP_PROFILE:-./seccomp.json}
    stop_grace_period: 5m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
